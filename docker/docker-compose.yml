services:
  gestion-redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${GESTION_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${GESTION_REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      - sysacad_net

  gestion-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GESTION_DB_NAME}
      POSTGRES_USER: ${GESTION_DB_USER}
      POSTGRES_PASSWORD: ${GESTION_DB_PASSWORD}
    volumes:
      - gestion_db_data:/var/lib/postgresql/data
    networks:
      - sysacad_net

  gestion:
    build:
      context: ../microservicios/microservicio_gestion
      dockerfile: Dockerfile
    image: gestion-ms:v1.0.0
    env_file:
      - .env
    environment:
      FLASK_ENV: ${GESTION_FLASK_ENV}
      GESTION_SECRET_KEY: ${GESTION_SECRET_KEY}
      GESTION_DEV_DATABASE_URI: ${GESTION_DEV_DATABASE_URI}
      GESTION_TEST_DATABASE_URI: ${GESTION_TEST_DATABASE_URI}
      GESTION_DATABASE_URI: ${GESTION_DATABASE_URI}
      REDIS_HOST: gestion-redis
      REDIS_PORT: ${GESTION_REDIS_PORT}
      REDIS_DB: ${GESTION_REDIS_DB}
      REDIS_PASSWORD: ${GESTION_REDIS_PASSWORD}
      REDIS_URL: redis://gestion-redis:${GESTION_REDIS_PASSWORD}@gestion-redis:${GESTION_REDIS_PORT}/${GESTION_REDIS_DB}
    depends_on:
      - gestion-redis
      - gestion-db
    restart: unless-stopped
    networks:
      - sysacad_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestion.rule=Host(`${GESTION_HOST}`)"
      - "traefik.http.routers.gestion.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.services.gestion.loadbalancer.server.port=5000"
    deploy:
      replicas: 2

  alumno-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ALUMNO_DB_NAME}
      POSTGRES_USER: ${ALUMNO_DB_USER}
      POSTGRES_PASSWORD: ${ALUMNO_DB_PASSWORD}
    volumes:
      - alumno_db_data:/var/lib/postgresql/data
    networks:
      - sysacad_net

  alumno:
    build:
      context: ../../microservicio_alumno
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SECRET_KEY: ${ALUMNO_SECRET_KEY}
      DEBUG: ${ALUMNO_DEBUG}
      ALLOWED_HOSTS: ${ALUMNO_ALLOWED_HOSTS}
      POSTGRES_DB: ${ALUMNO_DB_NAME}
      POSTGRES_USER: ${ALUMNO_DB_USER}
      POSTGRES_PASSWORD: ${ALUMNO_DB_PASSWORD}
      DATABASE_HOST: alumno-db
      DATABASE_PORT: 5432
    depends_on:
      - alumno-db
    restart: unless-stopped
    networks:
      - sysacad_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alumno.rule=Host(`${ALUMNO_HOST}`)"
      - "traefik.http.routers.alumno.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.services.alumno.loadbalancer.server.port=8000"
    deploy:
      replicas: 2

  documentacion-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DOCUMENTACION_DB_NAME}
      POSTGRES_USER: ${DOCUMENTACION_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENTACION_DB_PASSWORD}
    volumes:
      - documentacion_db_data:/var/lib/postgresql/data
    networks:
      - sysacad_net

  documentacion-redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${DOCUMENTACION_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${DOCUMENTACION_REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      - sysacad_net

  documentacion:
    build:
      context: ../../microservicio_documentacion
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLASK_CONTEXT: ${DOCUMENTACION_FLASK_CONTEXT}
      SECRET_KEY: ${DOCUMENTACION_SECRET_KEY}
      DEV_DATABASE_URI: ${DOCUMENTACION_DEV_DATABASE_URI}
      TEST_DATABASE_URI: ${DOCUMENTACION_TEST_DATABASE_URI}
      PROD_DATABASE_URI: ${DOCUMENTACION_PROD_DATABASE_URI}
      HASHIDS_SALT: ${DOCUMENTACION_HASHIDS_SALT}
      HASHIDS_MIN_LENGTH: ${DOCUMENTACION_HASHIDS_MIN_LENGTH}
      HASHIDS_ALPHABET: ${DOCUMENTACION_HASHIDS_ALPHABET}
      REDIS_HOST: documentacion-redis
      REDIS_PORT: ${DOCUMENTACION_REDIS_PORT}
      REDIS_DB: ${DOCUMENTACION_REDIS_DB}
      REDIS_PASSWORD: ${DOCUMENTACION_REDIS_PASSWORD}
      REDIS_URL: redis://documentacion-redis:${DOCUMENTACION_REDIS_PASSWORD}@documentacion-redis:${DOCUMENTACION_REDIS_PORT}/${DOCUMENTACION_REDIS_DB}    
    depends_on:
      - documentacion-db
      - documentacion-redis
    restart: unless-stopped
    networks:
      - sysacad_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.documentacion.rule=Host(`${DOCUMENTACION_HOST}`)"
      - "traefik.http.routers.documentacion.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.services.documentacion.loadbalancer.server.port=5000"
    deploy:
      replicas: 2

  estructura:
    profiles:
      - estructura
    image: flask-sysacad:v1.0.0
    env_file:
      - .env
    environment:
      FLASK_CONTEXT: ${FLASK_CONTEXT}
      SQLALCHEMY_TRACK_MODIFICATIONS: ${SQLALCHEMY_TRACK_MODIFICATIONS}
      SQLALCHEMY_RECORD_QUERIES: ${SQLALCHEMY_RECORD_QUERIES}
      PROD_DATABASE_URI: ${PROD_DATABASE_URI}
    networks:
      - sysacad_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.estructura.rule=Host(`${ESTRUCTURA_HOST}`)"
      - "traefik.http.routers.estructura.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.services.estructura.loadbalancer.server.port=5000"
    deploy:
      replicas: 1

networks:
  sysacad_net:
    driver: bridge
  traefik:
    external: true

volumes:
  gestion_db_data:
  alumno_db_data:
  documentacion_db_data:
